<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gate 1 Console · Nhom4Nguoi</title>
<meta name="description" content="Bảng điều khiển quyết định Gate 1 cho trợ lý hoàn tiền giao trễ của LogiX-VN.">
<style>
:root {
  --bg: #eef2f8; --surface: #ffffff; --side: #e4ebf5; --ink: #1b2433; --muted: #5a667d; --line: #d3dbe8;
  --accent: #3b6fb6; --accent-bg: #dbe7f7;
  --ok: #1d7a4c; --ok-bg: #dcf2e6; --warn: #8a5800; --warn-bg: #fcefc8; --bad: #a3231f; --bad-bg: #fbdad7;
  --info: #2b5c9e; --info-bg: #dbe8f8; --shadow: 0 1px 2px rgba(27,36,51,.06);
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "SF Mono", Consolas, Menlo, monospace;
  --r: 12px;
}
:root[data-theme="dark"] {
  --bg: #111823; --surface: #18212f; --side: #141c28; --ink: #e6ecf7; --muted: #98a4bb; --line: #2a3548;
  --accent: #7fa6e0; --accent-bg: #223552;
  --ok: #6fd3a0; --ok-bg: #173a2a; --warn: #f0c35f; --warn-bg: #3d3112; --bad: #ff9b92; --bad-bg: #432020;
  --info: #8db6ee; --info-bg: #1e3454; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; font-weight: 600; }
h2 { font-size: 20px; } h3 { font-size: 16px; }

/* shell */
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 10px 18px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.stepper { display: flex; gap: 4px; flex: 1; min-width: 360px; overflow-x: auto; }
.step { flex: 1; min-width: 118px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 12.5px; background: var(--bg); display: flex; flex-direction: column; gap: 1px; }
.step b { font-weight: 600; font-size: 13px; }
.step.done { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.step.cur { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.info { background: var(--info-bg); color: var(--info); }
.chip.idle { background: transparent; color: var(--muted); border: 1.5px dashed var(--line); font-weight: 500; }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 62px); }
.side { background: var(--side); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.side h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px 2px; font-weight: 600; }
.persona { display: grid; gap: 6px; padding: 0 4px 10px; }
.persona button { text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13.5px; }
.persona button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-bg); font-weight: 600; }
.nav button { width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px; border: 0; background: transparent; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.nav button:hover { background: rgba(59,111,182,.1); }
.nav button[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 600; }
.nav .dotmark { font-size: 11px; color: var(--muted); }
.main { padding: 20px clamp(14px, 2.4vw, 32px) 60px; display: grid; gap: 18px; align-content: start; min-width: 0; }
.page-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-title p { margin: 2px 0 0; color: var(--muted); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card > header p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.ro-banner { background: var(--info-bg); color: var(--info); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; display: flex; gap: 8px; align-items: center; }
.alert { border-radius: 10px; padding: 10px 14px; font-size: 14px; border: 1px solid transparent; }
.alert.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.alert.ok { background: var(--ok-bg); color: var(--ok); }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl tr.worst td { background: var(--bad-bg); }
.scroll { overflow-x: auto; }
.cell { display: inline-flex; align-items: center; gap: 8px; }
.pend { border: 1.5px dashed var(--line); color: var(--muted); border-radius: 8px; padding: 2px 10px; font-size: 12.5px; display: inline-block; }

/* controls */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; cursor: pointer; font-weight: 600; transition: background-color .12s, transform .1s; }
.btn:hover:not(:disabled) { background: var(--accent-bg); } .btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; } :root[data-theme="dark"] .btn.primary { color: #0b1320; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; } :root[data-theme="dark"] .btn.danger { color: #1b0b0b; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .nav button:focus-visible, .persona button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { opacity: .65; cursor: not-allowed; }
input[type=range] { width: 100%; accent-color: var(--accent); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
label.f > span:first-child { font-weight: 600; }
.req-empty { border-color: var(--bad) !important; }
.sw { position: relative; width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; padding: 0; flex: none; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform .12s; }
.sw[aria-checked="true"] { background: var(--ok-bg); border-color: var(--ok); } .sw[aria-checked="true"]::after { transform: translateX(20px); background: var(--ok); }
.sw:disabled { cursor: not-allowed; opacity: .6; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.kpi { font-size: 26px; font-family: var(--mono); font-weight: 600; letter-spacing: -.02em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 700; }

/* gate cards / timeline */
.gate { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--bg); }
.gate code, code { font-family: var(--mono); font-size: .88em; background: var(--bg); padding: 1px 6px; border-radius: 6px; }
.counts { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 12.5px; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tl li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; }
.tl li .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--ink); }
.tl li b { display: block; font-size: 13px; }
.tl li.warn { background: var(--warn-bg); border-color: transparent; } .tl li.warn .ic { background: var(--warn); color: #fff; }
.tl li.bad { background: var(--bad-bg); border-color: transparent; } .tl li.bad .ic { background: var(--bad); color: #fff; }
.tl li.blk { background: var(--ok-bg); border-color: transparent; } .tl li.blk .ic { background: var(--ok); color: #fff; }
.tl li.mod { background: var(--info-bg); border-color: transparent; } .tl li.mod .ic { background: var(--info); color: #fff; }
.pii { background: var(--bad-bg); color: var(--bad); border-radius: 6px; padding: 0 6px; font-family: var(--mono); font-size: 12px; }
.fld { background: var(--accent-bg); color: var(--accent); border-radius: 6px; padding: 0 6px; font-family: var(--mono); font-size: 12px; }
.sumrow { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 14px; padding: 10px 0 0; }
details.acc { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 0 12px; }
details.acc + details.acc { margin-top: 8px; }
details.acc summary { cursor: pointer; padding: 10px 0; font-weight: 600; }
details.acc[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
details.acc .body { padding-bottom: 12px; font-size: 14px; }
.tree ul { list-style: none; margin: 4px 0 0 0; padding-left: 20px; border-left: 2px solid var(--line); display: grid; gap: 6px; }
.tree li > .node { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr) auto; gap: 6px; align-items: center; }
.bar { height: 14px; border-radius: 7px; background: var(--accent); min-width: 3px; }
.bar.ok { background: var(--ok); } .bar.bad { background: var(--bad); } .bar.muted { background: var(--line); }
.modal-bg { position: fixed; inset: 0; background: rgba(10,16,26,.55); display: none; place-items: center; z-index: 50; padding: 16px; }
.modal-bg.on { display: grid; }
.modal { background: var(--surface); border-radius: 14px; padding: 22px; max-width: 460px; width: 100%; display: grid; gap: 12px; border: 2px solid var(--bad); }
.kill-banner { background: var(--bad); color: #fff; padding: 8px 18px; font-weight: 600; display: none; }
:root[data-theme="dark"] .kill-banner { color: #1b0b0b; }
.kill-banner.on { display: block; }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 60; }
.toast.on { opacity: 1; }

@media (max-width: 980px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); }
  .persona { grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; }
  .nav { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; } .nav button { width: auto; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .tree li > .node { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="kill-banner" id="killBanner" role="alert"></div>
<header class="top">
  <div class="brand">Gate 1 Console<small id="brandSub"></small></div>
  <div class="stepper" id="stepper" aria-label="Giai đoạn"></div>
  <div class="badges" id="badges"></div>
</header>
<div class="layout">
  <aside class="side" aria-label="Điều hướng">
    <h3>Bạn đang là</h3>
    <div class="persona" id="persona"></div>
    <h3>Màn hình</h3>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const D = /*__DATA__*/null;
</script>
<script>
(function () {
'use strict';
if (!D) { document.getElementById('main').innerHTML = '<div class="card">Chưa có dữ liệu. Chạy <code>python console/build.py</code>.</div>'; return; }

/* ---------- helpers ---------- */
const nf = n => (n == null ? '—' : Number(n).toLocaleString('vi-VN'));
const dec = (v, d) => (v == null ? '—' : Number(v).toFixed(d).replace('.', ','));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r) => (r || document).querySelector(s);
const P = D.pool, C = D.criteria, R = D.reports, G0 = D.gates;
const ROLES = [
  { id: 'gate', name: 'Kỹ sư cổng', who: 'Bùi Thái Sỹ, Nguyễn Công Tú' },
  { id: 'biz', name: 'Sản phẩm & kinh doanh', who: 'Hoàng Ngọc Hiệu' },
  { id: 'ops', name: 'Vận hành & pháp lý', who: 'Đoàn Sỹ Hưng' }
];
const PII_FIELDS = ['customer_note', 'recipient_contact', 'recipient_name', 'recipient_phone', 'street'];
const STORE = 'g1console.v1';

/* ---------- state ---------- */
const BASE_DRAFT = {
  decision: { v2: '', ev: {} },
  lines: { env: '', reduce: '', pilot: '' },
  biz: { cap: D.sweep.caps.indexOf(G0.business.daily_refund_cap_vnd), budget: D.sweep.budgets.indexOf(G0.business.cost_budget_per_ticket_vnd), scope: 'all', roi: G0.business.roi_min, reasons: { cap: '', budget: '', scope: '', roi: '' } },
  ops: { pic: G0.operations.pic, approver: G0.operations.approver_id, reviewers: G0.operations.reviewers_on_shift, capacity: G0.operations.review_capacity_per_hour, wait: G0.operations.max_queue_wait_minutes, channel: G0.operations.alert_channel, sampling: G0.operations.review_sampling_pct, stops: G0.operations.stop_conditions.join('\n'), recorded: !!G0.legal.carrier_fault_requires_recorded_cause },
  peak: { k: 1, share: 50 },
  incident: { card: '', rows: '', before: [{ t: 'Tác hại (sự kiện đỉnh)', e: '', c: [] }], after: [{ t: 'Tác hại (sự kiện đỉnh)', e: '', c: [] }], reduce: '' },
  submit: {}
};
const S = { persona: 'gate', view: 'overview', theme: null, killed: null, tab: { gate: 'sim' }, treeTab: 'before',
  sim: { mode: 'suite', suite: 'T-002', seed: '55', order: 'O-1002', utt: 'u1', text: '', tog: [1, 1, 1], res: null, err: '' },
  segFrom: 'prepared', draft: JSON.parse(JSON.stringify(BASE_DRAFT)) };
try {
  const sv = JSON.parse(localStorage.getItem(STORE) || 'null');
  if (sv) { Object.assign(S.draft, sv.draft || {}); S.persona = sv.persona || S.persona; S.theme = sv.theme || null; S.killed = sv.killed || null; }
} catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify({ draft: S.draft, persona: S.persona, theme: S.theme, killed: S.killed })); } catch (e) {} }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }
function setTheme() {
  const dark = S.theme ? S.theme === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
const canEdit = owner => owner === 'all' || owner === S.persona;
const dis = owner => (canEdit(owner) ? '' : 'disabled');
const roName = id => (ROLES.find(r => r.id === id) || {}).name;
const roBanner = owner => (canEdit(owner) ? '' : `<div class="ro-banner">🔒 Chỉ đọc: phần này thuộc vai <b>${esc(roName(owner))}</b>. Đổi vai ở thanh bên trái để sửa.</div>`);
const chip = (cls, txt) => `<span class="chip ${cls}">${txt}</span>`;
const ok = (b, a = 'ĐẠT', c = 'CHƯA') => (b ? chip('ok', '✓ ' + a) : chip('bad', '✗ ' + c));

/* ---------- criteria tests ---------- */
const rq = C.required, bo = C.business_ops;
const ROWS = [
  { k: 'pass_rate', label: 'pass_rate', thr: '≥ ' + dec(rq.pass_rate_min, 2), v: r => r.pass_rate, f: v => dec(v, 4), t: v => v >= rq.pass_rate_min },
  { k: 'pass_k', label: 'pass^k', thr: '≥ ' + dec(rq.pass_k_min, 2), v: r => r.pass_k, f: v => dec(v, 4), t: v => v >= rq.pass_k_min },
  { k: 'refund', label: 'hoàn sai (đ)', thr: '≤ ' + nf(rq.wrongful_refund_vnd_max), v: r => r.wrongful_refund, f: nf, t: v => v <= rq.wrongful_refund_vnd_max },
  { k: 'faults', label: 'lỗi oan hãng', thr: '≤ ' + rq.wrongful_carrier_faults_max, v: r => r.wrongful_faults, f: nf, t: v => v <= rq.wrongful_carrier_faults_max },
  { k: 'pii', label: 'lộ dữ liệu cá nhân', thr: '≤ ' + rq.pii_leaks_max, v: r => r.pii, f: nf, t: v => v <= rq.pii_leaks_max },
  { k: 'cost', label: 'chi phí/ticket (đ)', thr: '≤ ' + nf(bo.cost_per_ticket_vnd_max), v: r => r.cost, f: nf, t: v => v <= bo.cost_per_ticket_vnd_max },
  { k: 'roi', label: 'ROI', thr: '≥ ' + dec(bo.roi_min, 1), v: r => r.roi, f: v => dec(v, 2), t: v => v >= bo.roi_min },
  { k: 'cov', label: 'độ phủ', thr: 'không có ngưỡng', v: r => r.coverage, f: v => dec(v, 2), t: null },
  { k: 'queue', label: 'hàng chờ', thr: '≤ ' + bo.queue_stuck_max + ' ca ùn', v: r => r.queue_stuck, f: (v, r) => `${v} ca ùn · chờ ${dec(r.queue_wait_max, 0)} phút`, t: v => v <= bo.queue_stuck_max }
];
function failing(r) { return r ? ROWS.filter(x => x.t && !x.t(x.v(r))).map(x => x.label).concat((r.violations || []).map(v => 'vượt trần: ' + v)) : []; }

/* ---------- header / nav ---------- */
const STEPS = [['Setup', 'done'], ['Tiêu chí đã ký', 'done'], ['Đo & rủi ro', 'done'], ['Cổng vòng 1', 'done'], ['Sự cố', 'cur'], ['Quyết định v2', '']];
function renderTop() {
  $('#brandSub').textContent = D.meta.short + ' · lớp L3B';
  $('#stepper').innerHTML = STEPS.map((s, i) => `<div class="step ${s[1]}" ${s[1] === 'cur' ? 'aria-current="step"' : ''}><span class="muted" style="font-size:11px">Bước ${i + 1}${s[1] === 'done' ? ' · xong' : s[1] === 'cur' ? ' · chờ thẻ' : ''}</span><b>${s[0]}</b></div>`).join('');
  const sg = D.meta.signed_at.slice(11, 16);
  $('#badges').innerHTML = chip('ok', '✓ integrity') + chip('info', `Đã ký ${sg} · hash ${D.meta.hash}`) +
    `<button class="btn" data-act="theme" aria-label="Đổi giao diện sáng tối">${document.documentElement.getAttribute('data-theme') === 'dark' ? '☀ Sáng' : '☾ Tối'}</button>`;
}
const VIEWS = [['overview', 'Tổng quan Gate 1', ''], ['gate', 'Kỹ sư cổng', 'gate'], ['biz', 'Sản phẩm & kinh doanh', 'biz'], ['ops', 'Vận hành & pháp lý', 'ops'], ['incident', 'Sự cố', ''], ['submit', 'Nộp bài', '']];
function renderNav() {
  $('#persona').innerHTML = ROLES.map(r => `<button data-act="persona" data-id="${r.id}" aria-pressed="${S.persona === r.id}">${esc(r.name)}<br><span class="muted" style="font-size:12px">${esc(r.who)}</span></button>`).join('');
  $('#nav').innerHTML = VIEWS.map(v => `<button data-act="view" data-id="${v[0]}" ${S.view === v[0] ? 'aria-current="page"' : ''}><span>${v[1]}</span><span class="dotmark">${v[2] && v[2] === S.persona ? 'của bạn' : v[2] ? 'chỉ đọc' : ''}</span></button>`).join('');
  const kb = $('#killBanner');

function stepsOf(run) {
  const out = [], push = (ic, t, d, cls) => out.push({ ic, t, d, cls: cls || '' });
  run.events.forEach(e => {
    switch (e.type) {
      case 'pre_guard': push('P', 'pre_guard', `${e.action}: ${e.reason}`, 'mod'); break;
      case 'llm_extract': push('1', 'Đọc ticket', `ý định ${e.intent}${e.claimed_delay_days != null ? ' · khách khai ' + e.claimed_delay_days + ' ngày' : ''}${e.trust_claim ? ' · tin lời khách' : ''}${e.directive ? ' · có lệnh cài trong ghi chú' : ''}`, (e.trust_claim || e.directive) ? 'warn' : ''); break;
      case 'tracking': push('2', 'Tra DB tracking', `trễ ${e.db_delay_days} ngày · nguyên nhân ${e.cause}${e.cause_recorded ? '' : ' (DB không ghi)'}`); break;
      case 'llm_extract_note': if (e.directive) push('!', 'Ghi chú khi mua hàng', 'có lệnh cài trong ghi chú', 'warn'); break;
      case 'model_override': push('!', 'Model đè số DB', `DB ${e.db} ngày bị thay bằng số khách khai ${e.ticket} ngày`, 'bad'); break;
      case 'policy': push('3', 'Chọn chính sách', `${e.policy_id}${e.pinned ? ' (ghim)' : ''}`); break;
      case 'llm_error': push('!', 'LLM lỗi', e.error, 'warn'); break;
      case 'llm_fallback': push('!', 'LLM dự phòng', `${e.purpose}${e.mode ? ' · ' + e.mode : ''}`, 'warn'); break;
      case 'directive_obeyed': push('!', 'Làm theo lệnh trong ticket', JSON.stringify(e.directive), 'bad'); break;
      case 'proposal': push('4', 'Đề xuất hoàn', `${nf(e.amount_vnd)}đ · người trả ${e.payer} · cơ sở ${e.basis}`, e.amount_vnd > 0 ? '' : ''); break;
      case 'approval_used': push('4', 'Dùng phê duyệt', e.approval_id); break;
      case 'guard': push('G', 'guard ' + e.kind, e.kind === 'refund_check' ? `DB trễ ${e.db_delay_days} ngày · quyền lợi ${nf(e.entitled)}đ · đã hoàn ${nf(e.already)}đ · đòi ${nf(e.asked)}đ` : JSON.stringify(e), 'mod'); break;
      case 'gate': push('G', `gate ${e.tool}: ${e.action}`, e.reason, e.action === 'modify' ? 'mod' : 'blk'); break;
      case 'legal_gate': push('§', 'Cổng pháp lý (config)', `${e.gate}${e.dropped ? ' · bỏ ' + e.dropped.join(', ') : ''}`, 'blk'); break;
      case 'business_gate': push('$', 'Cổng kinh doanh (config)', e.gate, 'blk'); break;
      case 'host_denied': push('H', 'Host chặn', e.reason, 'blk'); break;
      case 'switch': push('S', 'Công tắc tool', `${e.tool} = ${e.state}`, 'blk'); break;
      case 'write_retry': push('!', 'Ghi lại lần 2', e.tool, 'warn'); break;
      case 'tool':
        if (e.tool === 'issue_refund') push('5', 'Sổ cái', `+${nf(e.amount_vnd)}đ · ${e.payer}${e.approval_id ? ' · duyệt ' + e.approval_id : ''}`, 'bad');
        else if (e.tool === 'file_carrier_fault') push('6', 'Lỗi hãng', `${e.carrier_id} · ${e.parcel_id} · ${e.delay_days} ngày`, 'bad');
        else if (e.tool === 'notify_carrier') push('7', 'Payload gửi hãng', Object.keys(e.payload).map(k => `<span class="${PII_FIELDS.includes(k) ? 'pii' : 'fld'}">${esc(k)}</span>`).join(' '), '', true);
        else if (e.tool === 'send_reply') push('8', 'Trả lời khách', esc((e.payload || {}).text || ''));
        break;
      case 'result': push('✓', 'Kết quả', `${e.status}${e.amount_vnd ? ' · ' + nf(e.amount_vnd) + 'đ' : ''}${e.reason ? ' · ' + e.reason : ''}`); break;
    }
  });
  return out;
}

function findScenario() {

function bizKey() { const b = S.draft.biz; return `${b.scope}|${D.sweep.caps[b.cap]}|${D.sweep.budgets[b.budget]}`; }
function bizEst() {
  const b = S.draft.biz, g = D.sweep.grid[bizKey()], cur = D.sweep.grid[`all|${G0.business.daily_refund_cap_vnd}|${G0.business.cost_budget_per_ticket_vnd}`];
  if (!g) return '<p class="muted">Chưa có tổ hợp này.</p>';
  const d = (a, c, f) => { const x = a - c; return x === 0 ? '<span class="muted">không đổi</span>' : `<span class="${x > 0 ? 'bad' : 'ok'}" style="color:var(--${x > 0 ? 'bad' : 'ok'})">${x > 0 ? '+' : ''}${f(x)}</span>`; };
  const roiLow = g.roi < b.roi, costHi = g.cost > bo.cost_per_ticket_vnd_max, cat = [];
  if (roiLow) cat.push(`ROI ước tính ${dec(g.roi, 2)} thấp hơn ngưỡng ${dec(b.roi, 2)}`);
  if (costHi) cat.push(`chi phí ${nf(g.cost)}đ vượt ngưỡng đã ký ${nf(bo.cost_per_ticket_vnd_max)}đ`);
  (g.violations || []).forEach(v => cat.push(v));
  return `<div class="grid3" style="gap:10px"><div class="gate"><span class="muted">Chi phí/ticket</span><span class="kpi">${nf(g.cost)}đ</span><span style="font-size:12.5px">so với hiện tại ${d(g.cost, cur.cost, nf)}</span></div>

function costChart() {
  const g = D.sweep.grid[bizKey()];

  const max = 11000;
  const bar = (v, c) => `<div style="position:relative;height:24px;background:var(--bg);border-radius:6px"><div class="bar ${c}" style="height:24px;width:${Math.min(100, v / max * 100)}%"></div>
    <i style="position:absolute;left:${bo.cost_per_ticket_vnd_max / max * 100}%;top:-3px;bottom:-3px;border-left:2px dashed var(--warn)"></i><i style="position:absolute;left:${R.base.manual_cost / max * 100}%;top:-3px;bottom:-3px;border-left:2px solid var(--bad)"></i></div>`;
  return `<div style="display:grid;gap:10px">${items.map(x => `<div style="display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center"><span class="muted">${x[0] === 'slider' ? 'theo nút xoay' : x[0]}</span>${bar(x[1], x[1] > bo.cost_per_ticket_vnd_max ? 'bad' : 'ok')}<span class="num r" style="text-align:right">${nf(x[1])}đ</span></div>`).join('')}</div>

function segTable() {
  const r = R[S.segFrom], seg = r.by_segment;

  const cars = seg.carrier;
  const worstC = cars.slice().sort((a, b) => (a.pass_rate - b.pass_rate) || (b.wrongful_refund_vnd - a.wrongful_refund_vnd))[0];
  const rowsW = whs.map(x => `<tr class="${x.id === worstW.id ? 'worst' : ''}"><td class="mono">${esc(x.id)}</td><td class="num r">${x.trials}</td><td class="num r">${dec(x.pass_rate, 4)}</td><td class="num r">${nf(x.wrongful_refund_vnd)}</td><td class="num r">${x.wrongful_carrier_faults}</td><td class="num r">${x.pii_leaks}</td><td class="num r">${x.cost_per_ticket_vnd == null ? '—' : nf(x.cost_per_ticket_vnd) + 'đ'}${x.worse_than_manual ? ' ' + chip('bad', '> làm tay') : ''}</td></tr>`).join('');
  const rowsC = cars.map(x => `<tr class="${x.id === worstC.id && (x.pass_rate < 1 || x.wrongful_refund_vnd) ? 'worst' : ''}"><td class="mono">${esc(x.id)}</td><td class="num r">${x.trials}</td><td class="num r">${dec(x.pass_rate, 4)}</td><td class="num r">${nf(x.wrongful_refund_vnd)}</td><td class="num r">${x.wrongful_carrier_faults}</td><td class="num r">${x.pii_leaks}</td><td class="muted">—</td></tr>`).join('');

}

function peakCalc() {
  const k = S.draft.peak.k, sh = S.draft.peak.share / 100, o = S.draft.ops;
  const tpd = R.prepared.tickets_per_day * k, rr = R.prepared.review_rate;
  const arr = tpd * sh * rr, capH = Math.max(1, o.reviewers) * (o.capacity || 6);
  const backlog = Math.max(0, arr - capH), wait = backlog / capH * 60, need = Math.max(1, Math.ceil(arr / (o.capacity || 6)));
  const extra = Math.max(0, need - o.reviewers) * D.limits.ops_facts.reviewer_standby_fee_vnd;
  const lvl = wait >= (o.wait || 45) ? 'bad' : wait >= 30 ? 'warn' : arr > capH * 0.85 ? 'warn' : 'ok';
  return { tpd, arr, capH, wait, need, extra, lvl, cost: Math.round((R.prepared.cost * R.prepared.tickets_per_day + extra / 1) / R.prepared.tickets_per_day) };
}

    ['submission/submission.json', false, '[THIẾU] đang rỗng', 'Điền team, members dạng <code>HoVaTen-MSSV</code>, incident, decision_v1, decision_v2, three_lines.'],
    ['TEAM.md · bảng thành viên', true, '4 người', ''],
    ['TEAM.md · mục cá nhân', false, '[THIẾU] 0/4 người', 'Mỗi người viết mục <code>## HoVaTen-MSSV</code> (phần việc, đóng góp, bằng chứng, exit ticket).'],
    ['Lệnh 7 in ĐỦ THÀNH PHẦN', false, '[THIẾU] chưa chạy', 'Chạy <code>python -m lab10.check_submission --collect</code>, sửa từng dòng THIẾU, chạy lại.'],
    ['Merge nhánh demo vào main và push', false, '[THIẾU]', 'Team chấm đọc nhánh main. Merge xong chạy lại lệnh 7 trên main.']];
  const members = [['Bùi Thái Sỹ', '2A202604002'], ['Nguyễn Công Tú', '2A202604008'], ['Hoàng Ngọc Hiệu', '2A202603976'], ['Đoàn Sỹ Hưng', '2A202603990']];
  const done = items.filter(x => x[1]).length;
  return `<div class="page-title"><div><h2>Nộp bài</h2><p>Bài nộp là thư mục <code>submission/</code> do lệnh 7 gom, cùng <code>TEAM.md</code>.</p></div>${chip(done === items.length ? 'ok' : 'warn', done + '/' + items.length + ' thành phần')}</div>
  <section class="card"><header><div><h3>Thành phần phải nộp</h3></div></header><div class="scroll"><table class="tbl"><thead><tr><th>Thành phần</th><th>Trạng thái</th><th>Hướng dẫn</th></tr></thead><tbody>
    ${items.map(x => `<tr><td>${esc(x[0])}</td><td>${x[1] ? chip('ok', '✓ ' + esc(x[2])) : chip('bad', esc(x[2]))}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">Trạng thái ghi tại thời điểm dựng console; chạy lại <code>python console/build.py</code> không cập nhật phần này, hãy chạy lệnh 7 để biết số thật.</p></section>
  <section class="card"><header><div><h3>Mỗi thành viên nộp link repo trên LMS</h3><p>Hạn chót: lab chiều/tối 11h59 GMT+7 hôm sau (xác nhận lại với Lab Coach).</p></div></header>
    ${members.map((m, i) => `<label class="row" style="margin:4px 0"><input type="checkbox" data-bind="submit.lms${i}" ${ck['lms' + i] ? 'checked' : ''}> <span>${esc(m[0])} <span class="muted mono">${m[1]}</span></span></label>`).join('')}</section>`;
}

/* ---------- render ---------- */
function renderMain() {
  const f = { overview: renderOverview, gate: renderGate, biz: renderBiz, ops: renderOps, incident: renderIncident, submit: renderSubmit }[S.view];
  const keep = document.activeElement && document.activeElement.id;
  $('#main').innerHTML = f();
  if (keep) { const el = document.getElementById(keep); if (el) el.focus(); }
}
function render() { setTheme(); renderTop(); renderNav(); renderMain(); }

/* ---------- state binding ---------- */
function setPath(path, val) {
  const parts = path.split('.'); let o = parts[0] === 'sim' ? S : S.draft;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = val;
}
function treeAt(path) { const t = S.draft.incident[S.treeTab]; let list = t, node = null; path.split('.').forEach(i => { node = list[+i]; list = node.c; }); return node; }
function parentList(path) { const t = S.draft.incident[S.treeTab], ps = path.split('.').map(Number); let list = t; for (let i = 0; i < ps.length - 1; i++) list = list[ps[i]].c; return [list, ps[ps.length - 1]]; }
function updBiz() {
  const b = S.draft.biz;
  const el = id => document.getElementById(id);
  if (el('lbl_cap')) el('lbl_cap').textContent = nf(D.sweep.caps[b.cap]) + 'đ';
  if (el('lbl_budget')) el('lbl_budget').textContent = nf(D.sweep.budgets[b.budget]) + 'đ';
  if (el('lbl_scope')) el('lbl_scope').textContent = b.scope === 'all' ? 'tất cả' : b.scope;
  if (el('lbl_roi')) el('lbl_roi').textContent = dec(b.roi, 1);
  if (el('bizEst')) el('bizEst').innerHTML = bizEst();
  if (el('bizChart')) el('bizChart').innerHTML = costChart();
}
function updPeak() {
  const el = id => document.getElementById(id);
  if (el('lbl_k')) el('lbl_k').textContent = dec(S.draft.peak.k, 1);
  if (el('lbl_share')) el('lbl_share').textContent = S.draft.peak.share + '%';
  if (el('peakBox')) el('peakBox').innerHTML = peakHtml();
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.slide) {
    const k = t.dataset.slide;
    if (k === 'peak.k') { S.draft.peak.k = +t.value; save(); updPeak(); return; }
    if (k === 'peak.share') { S.draft.peak.share = +t.value; save(); updPeak(); return; }
    S.draft.biz[k] = k === 'scope' ? t.value : (k === 'roi' ? +t.value : +t.value); save(); updBiz(); return;
  }
  if (t.dataset.tree) { const n = treeAt(t.dataset.path); n[t.dataset.tree] = t.value; save(); return; }
  if (t.dataset.bind && t.type !== 'radio' && t.type !== 'checkbox') {
    let v = t.value; if (t.dataset.upper !== undefined) { v = v.toUpperCase(); t.value = v; }
    if (t.dataset.num !== undefined) v = +v;
    setPath(t.dataset.bind, v); save();
    if (t.dataset.bind.startsWith('ops.')) { updPeak(); }
    if (t.dataset.bind === 'incident.card') renderMain();
    if (t.dataset.bind.startsWith('biz.reasons')) t.classList.toggle('req-empty', !t.value.trim());
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.slide === 'scope') { S.draft.biz.scope = t.value; save(); updBiz(); return; }
  if (t.dataset.bind && (t.type === 'radio' || t.type === 'checkbox')) {
    setPath(t.dataset.bind, t.type === 'checkbox' ? t.checked : t.value); save();
    if (t.dataset.bind === 'decision.v2') renderMain();
    if (t.dataset.bind.startsWith('decision.ev')) save();
  } else if (t.dataset.bind && t.tagName === 'SELECT') {
    setPath(t.dataset.bind, t.value); save();
    if (t.dataset.bind.startsWith('sim.')) { S.sim.res = null; S.sim.err = ''; renderMain(); }
    if (t.dataset.bind.startsWith('ops.')) renderMain();
  }
});
function modal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.add('on'); const f = $('#modal input,#modal button'); if (f) f.focus(); }
function closeModal() { $('#modalBg').classList.remove('on'); }
function download(name, obj) {
  const txt = JSON.stringify(obj, null, 2);
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Đã chép JSON vào clipboard'), () => toast('Đã tạo file ' + name));
  else toast('Đã tạo file ' + name);
}
document.addEventListener('click', e => {
  if (e.target.id === 'modalBg') { closeModal(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'theme': S.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; save(); render(); return;
    case 'persona': S.persona = id; S.view = id; save(); render(); return;
    case 'view': S.view = id; render(); return;
    case 'gtab': S.tab.gate = id; renderMain(); return;
    case 'simmode': S.sim.mode = id; S.sim.res = null; S.sim.err = ''; renderMain(); return;
    case 'simseed': S.sim.seed = id; S.sim.res = null; renderMain(); return;
    case 'tog': if (canEdit('gate')) { S.sim.tog[+id] = S.sim.tog[+id] ? 0 : 1; if (S.sim.res) runSim(); renderMain(); } return;
    case 'run': runSim(); renderMain(); return;
    case 'runcompare': S.tab.gate = 'sim'; S.sim.mode = 'preset'; S.sim.order = 'O-1002'; S.sim.utt = 'u1'; S.sim.tog = [1, 1, 1]; runSim(); renderMain(); return;
    case 'loadsaved': { const x = [['O-1002', 'u1'], ['O-1026', 'u3'], ['O-1002', 'u4'], ['O-1004', 'u5']][+id]; S.tab.gate = 'sim'; S.sim.mode = 'preset'; S.sim.order = x[0]; S.sim.utt = x[1]; runSim(); renderMain(); return; }
    case 'seg': S.segFrom = id; $('#segBox').innerHTML = segTable(); return;
    case 'exportbiz': {
      const b = S.draft.biz;
      if (Object.values(b.reasons).some(v => !v.trim())) { toast('Cần đủ lý do cho cả 4 nút xoay'); renderMain(); return; }
      download('business.json', { business: { daily_refund_cap_vnd: D.sweep.caps[b.cap], cost_budget_per_ticket_vnd: D.sweep.budgets[b.budget], pilot_scope: b.scope === 'all' ? { mode: 'all', warehouses: [], percent: 100 } : { mode: 'warehouse', warehouses: b.scope.split('+'), percent: 100 }, roi_min: b.roi }, ly_do: b.reasons }); return; }
    case 'exportops': { const o = S.draft.ops; download('operations.json', { operations: { pic: o.pic, approver_id: o.approver, reviewers_on_shift: o.reviewers, review_capacity_per_hour: o.capacity, max_queue_wait_minutes: o.wait, stop_conditions: o.stops.split('\n').map(x => x.trim()).filter(Boolean), alert_channel: o.channel, review_sampling_pct: o.sampling } }); return; }
    case 'recorded': if (canEdit('ops')) { S.draft.ops.recorded = !S.draft.ops.recorded; save(); renderMain(); } return;
    case 'ttab': S.treeTab = id; renderMain(); return;
    case 'addnode': { const n = treeAt(t.dataset.path); n.c.push({ t: '', e: '', c: [] }); save(); renderMain(); return; }
    case 'delnode': { const [list, i] = parentList(t.dataset.path); list.splice(i, 1); save(); renderMain(); return; }
    case 'kill':
      modal(`<h3>Dừng khẩn trợ lý hoàn tiền?</h3><p style="margin:0">Bước 1/2. Trợ lý ngừng xử lý, mọi ticket chuyển sang hàng chờ CSKH. Đây là mô phỏng.</p><label class="f"><span>Người bấm</span><select id="killBy">${D.staff.map(s => `<option value="${s.staff_id}" ${s.staff_id === S.draft.ops.pic ? 'selected' : ''}>${s.staff_id} · ${esc(s.name)}</option>`).join('')}</select></label>
      <label class="f"><span>Bước 2/2: gõ <b>DUNG</b> để xác nhận</span><input type="text" id="killTxt" autocomplete="off"></label>
      <div class="row spread"><button class="btn" data-act="closemodal">Huỷ</button><button class="btn danger" data-act="killgo">Xác nhận dừng</button></div>`); return;
    case 'killgo': {
      if ($('#killTxt').value.trim().toUpperCase() !== 'DUNG') { $('#killTxt').classList.add('req-empty'); return; }
      const by = $('#killBy').value, d = new Date(); S.killed = { by, at: d.toTimeString().slice(0, 5) }; save(); closeModal(); render(); toast('Đã dừng khẩn (mô phỏng)'); return; }
    case 'resume':
      modal(`<h3>Bật lại trợ lý</h3><p style="margin:0;font-size:14px">Điều kiện: nguyên nhân đã sửa, ba chỉ số an toàn bằng 0, NV-TUNG và NV-HANH cùng ký.</p>
      <label class="row"><input type="checkbox" id="rs1"> <span>NV-TUNG đã ký</span></label><label class="row"><input type="checkbox" id="rs2"> <span>NV-HANH đã ký</span></label>
      <label class="f"><span>Lý do bật lại (bắt buộc)</span><textarea id="rsWhy"></textarea></label>
      <div class="row spread"><button class="btn" data-act="closemodal">Huỷ</button><button class="btn primary" data-act="resumego">Bật lại</button></div>`); return;
    case 'resumego': if ($('#rs1').checked && $('#rs2').checked && $('#rsWhy').value.trim()) { S.killed = null; save(); closeModal(); render(); toast('Đã bật lại (mô phỏng)'); } else toast('Cần cả hai chữ ký và lý do'); return;
    case 'closemodal': closeModal(); return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!S.theme) render(); });

function fromHash() {
  const h = (location.hash || '').slice(1).split(',');
  h.forEach(x => {
    if (['overview', 'gate', 'biz', 'ops', 'incident', 'submit'].includes(x)) { S.view = x; if (['gate', 'biz', 'ops'].includes(x)) S.persona = x; }
    if (x === 'sim') { S.view = 'gate'; S.persona = 'gate'; S.tab.gate = 'sim'; S.sim.mode = 'preset'; S.sim.order = 'O-1002'; S.sim.utt = 'u1'; S.sim.tog = [1, 1, 1]; runSim(); }
    if (x === 'gates') { S.view = 'gate'; S.tab.gate = 'gates'; }
    if (x === 'bad') { S.view = 'gate'; S.tab.gate = 'bad'; }
    if (x === 'dark') S.theme = 'dark';
    if (x === 'light') S.theme = 'light';
  });
}
fromHash();
render();
window.addEventListener('hashchange', () => { fromHash(); render(); });

/* ---------- self test: index.html?selftest=1 ---------- */
if (/[?&]selftest=1/.test(location.search)) {
  const log = [], t = (n, c) => log.push((c ? 'PASS ' : 'FAIL ') + n);
  try {
    t('overview renders table', document.querySelectorAll('.tbl tbody tr').length >= 9);
    S.view = 'gate'; S.tab.gate = 'sim'; renderMain();
    document.querySelector('[data-act="runcompare"]').click();
    const tx = document.getElementById('main').innerText;
    const cnt = x => (x.match(/\+30\.000đ/g) || []).length;
    const c1 = cnt(tx);
    t('compare: base refunds, gate-on blocks (' + c1 + ')', c1 === 2 && /sổ cái 30\.000đ → 0đ/.test(tx));
    S.sim.tog = [0, 1, 1]; runSim(); renderMain(); const c2 = cnt(document.getElementById('main').innerText);
    t('refund gate off: refund returns (' + c2 + ')', c2 === 4);
    S.view = 'biz'; S.persona = 'biz'; renderMain();
    const sl = document.querySelector('[data-slide="cap"]'); sl.value = 0; sl.dispatchEvent(new Event('input', { bubbles: true }));
    t('biz estimate updates', /Chi phí\/ticket/.test(document.getElementById('bizEst').innerText));
    S.view = 'ops'; S.persona = 'ops'; renderMain();
    const k = document.querySelector('[data-slide="peak.k"]'); k.value = 3; k.dispatchEvent(new Event('input', { bubbles: true }));
    t('peak updates', /VÀNG|ĐỎ|Trong năng lực/.test(document.getElementById('peakBox').innerText));
    S.view = 'overview'; renderMain();
    const r = document.querySelector('input[value="Tiếp tục"]'); r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true }));
    t('continue without after warns', /Chưa có cột/.test(document.getElementById('main').innerText));
    S.view = 'incident'; renderMain(); S.view = 'submit'; renderMain(); t('submit shows THIEU', /\[THIẾU\]/.test(document.getElementById('main').innerText));
  } catch (err) { log.push('ERROR ' + err.message); }
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = log.join('\n'); document.body.appendChild(pre);
}
})();
</script>
